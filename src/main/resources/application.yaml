spring:
  application:
    name: habitat
  datasource:
    url: ${HABITAT_DATABASE_URL:jdbc:postgresql://localhost:5432/habitat}
    username: ${HABITAT_DATABASE_USERNAME:habitat}
    password: ${HABITAT_DATABASE_PASSWORD:habitat}
  jpa:
    hibernate:
      ddl-auto: ${HABITAT_JPA_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
